# Configuración SOLO para tests: H2 en memoria imitando a PostgreSQL.
# Así los tests corren sin red y sin tocar la base de datos real de Supabase,
# pero aplican las MISMAS migraciones de Flyway (validamos el esquema de verdad).
spring.datasource.url=jdbc:h2:mem:torii;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Igual que en producción: el esquema lo crea Flyway, Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
