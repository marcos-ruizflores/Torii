# Test-only config: in-memory H2 in PostgreSQL mode.
# Tests run offline and never touch the real Supabase database, but they still
# apply the SAME Flyway migrations, so the schema actually gets validated.
spring.datasource.url=jdbc:h2:mem:torii;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Same as prod: Flyway creates the schema, Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
