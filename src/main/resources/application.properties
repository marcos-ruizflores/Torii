spring.application.name=Torii
server.port=8080

# Logs del algoritmo (cuántas consultas hace cada búsqueda).
logging.level.com.torii=INFO

# Nº máximo de llamadas SIMULTÁNEAS a las APIs de vuelos (hilos virtuales + semáforo).
# Súbelo si tu plan de la API permite más throughput; bájalo a 1-2 si ves errores 429.
# Es un límite GLOBAL, compartido por todas las búsquedas a la vez.
torii.search.max-concurrency=6

# ---------------------------------------------------------------------------
# Caché de búsquedas (prefijo torii.cache).
# Estos son los valores por defecto; puedes cambiarlos sin recompilar, o
# sobreescribirlos al arrancar, p. ej.:  --torii.cache.maximum-size=1000
# ---------------------------------------------------------------------------

# Máximo de entradas (pares de fechas) que guarda la caché.
torii.cache.maximum-size=50000

# Tramos del TTL variable: cuanto más lejos el viaje, más vive en caché.
# Umbrales (días que faltan para la salida):
torii.cache.ttl.far-threshold-days=60
torii.cache.ttl.medium-threshold-days=14
torii.cache.ttl.near-threshold-days=2
# Duración de cada tramo (acepta sufijos d/h/m/s):
torii.cache.ttl.far=7d
torii.cache.ttl.medium=24h
torii.cache.ttl.near=1h
torii.cache.ttl.imminent=10m

# ---------------------------------------------------------------------------
# Amadeus (prefijo torii.amadeus). DESHABILITADO por defecto.
# Para activarlo: regístrate en developers.amadeus.com, exporta tus claves como
# variables de entorno y pon enabled=true:
#     export AMADEUS_API_KEY=tu_key
#     export AMADEUS_API_SECRET=tu_secret
# Las claves NUNCA se escriben aquí: se leen de las variables de entorno.
# ---------------------------------------------------------------------------
torii.amadeus.enabled=false
torii.amadeus.base-url=https://test.api.amadeus.com
torii.amadeus.api-key=${AMADEUS_API_KEY:}
torii.amadeus.api-secret=${AMADEUS_API_SECRET:}
torii.amadeus.currency=EUR
torii.amadeus.max-results=5

# ---------------------------------------------------------------------------
# Google Flights vía SerpApi (prefijo torii.serpapi). DESHABILITADO por defecto.
# Google no tiene API pública propia; SerpApi la expone con una API key simple.
# Para activarlo: regístrate en serpapi.com y exporta tu key:
#     export SERPAPI_KEY=tu_key
# OJO: el plan gratuito de SerpApi es de ~100 búsquedas/mes; una sola búsqueda
# EXHAUSTIVE de Torii (306 llamadas) lo agotaría. Usar con caché + precisión FAST.
# ---------------------------------------------------------------------------
torii.serpapi.enabled=true
torii.serpapi.base-url=https://serpapi.com
torii.serpapi.api-key=${SERPAPI_KEY:}
torii.serpapi.currency=EUR
torii.serpapi.max-results=5

# ---------------------------------------------------------------------------
# FlightAPI.io (prefijo torii.flightapi). DESHABILITADO por defecto.
# Respaldo del failover para cuando SerpApi agote su cuota mensual.
# Para activarlo: regístrate en flightapi.io y exporta tu key:
#     export FLIGHTAPI_KEY=tu_key
# OJO: el plan de prueba son ~20 llamadas UNA SOLA VEZ (no mensuales) y cada
# petición roundtrip cuesta 2 créditos. Probar primero con UNA llamada
# (variability 0, rango mínimo) antes de lanzar búsquedas grandes.
# ---------------------------------------------------------------------------
torii.flightapi.enabled=true
torii.flightapi.base-url=https://api.flightapi.io
torii.flightapi.api-key=${FLIGHTAPI_KEY:}
torii.flightapi.currency=EUR
torii.flightapi.cabin-class=Economy
torii.flightapi.max-results=5
